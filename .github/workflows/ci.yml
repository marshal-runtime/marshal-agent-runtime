name: runtime-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
        node: [22.13.0, 24]
    # TODO(#11): make macOS and Windows gating once the listed failures are fixed.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    runs-on: ${{ matrix.os }}
    env:
      QUILLSTONE_NATIVE_CLONE_FALLBACK: copy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: node scripts/ci-canonical-tmpdir.mjs
      - run: node scripts/fetch-quillstone.mjs
      - run: pnpm verify:structure
      - run: pnpm install --frozen-lockfile
      - run: pnpm evals:validate
      - run: pnpm evals:test
      - run: pnpm verify
